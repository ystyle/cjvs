name: Build and Release

# 推 tag 即发版：工作流自己建 Release（挂三个平台二进制），不需要先手动建 Release。
# 重跑某个已发布 tag 的构建用 workflow_dispatch。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（重跑构建用，如 v0.4.2）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-26.04
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" \
                 --title "$TAG" --generate-notes --verify-tag

  build-linux:
    needs: prepare
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.1.0
          components: stdx

      - name: Install mingw toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip

      - name: Build Linux binary
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cjpm build
          cp ./target/release/bin/main ./target/release/bin/cjvs
          mkdir -p dist
          zip -j dist/cjvs_${TAG}_linux_amd64.zip ./target/release/bin/cjvs

      - name: Install Windows stdx
        run: |
          curl -sL "https://atomgit.com/Cangjie/cangjie_stdx/releases/download/v1.1.0.1/cangjie-stdx-windows-x64-1.1.0.1.zip" -o /tmp/stdx-win.zip
          mkdir -p $HOME/.config/cjvs/cache $HOME/.config/cjvs/stdx/1.1.0.1-windows
          unzip -o /tmp/stdx-win.zip -d $HOME/.config/cjvs/stdx/1.1.0.1-windows
          find $HOME/.config/cjvs/stdx/1.1.0.1-windows -name "libstdx.a" 2>/dev/null | head -5

      - name: Build Windows binary
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          STDX_WIN="$HOME/.config/cjvs/stdx/1.1.0.1-windows"
          PATH_WIN=$(find "${STDX_WIN}" -name "libstdx.a" 2>/dev/null | head -1 | xargs dirname)
          echo "Windows stdx path: ${PATH_WIN}"
          export CANGJIE_STDX_PATH="${PATH_WIN}"
          cjpm build --target x86_64-w64-mingw32
          cp ./target/x86_64-w64-mingw32/release/bin/main.exe ./target/x86_64-w64-mingw32/release/bin/cjvs.exe
          zip -j dist/cjvs_${TAG}_windows_amd64.zip ./target/x86_64-w64-mingw32/release/bin/cjvs.exe

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber

  build-macos:
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.1.0
          components: stdx

      - name: Build macOS binary
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          brew install openssl@3
          export DYLD_LIBRARY_PATH="$(brew --prefix openssl@3)/lib:$DYLD_LIBRARY_PATH"
          export LIBRARY_PATH="$(brew --prefix openssl@3)/lib:$LIBRARY_PATH"
          cjpm build
          cp ./target/release/bin/main ./target/release/bin/cjvs
          mkdir -p dist
          zip -j dist/cjvs_${TAG}_macos_aarch64.zip ./target/release/bin/cjvs

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
